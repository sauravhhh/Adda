<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f59e0b">
    <meta name="description" content="Adda — an Indian social media app. Installable PWA.">
    <title>Adda — Apna Social Media</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #fafafa;
            --card: #ffffff;
            --ink: #1c1c1e;
            --muted: #8e8e93;
            --line: #efefef;
            --saffron: #f59e0b;
            --saffron-d: #d97706;
            --green: #16a34a;
            --red: #ef4444;
            --radius: 14px;
        }
        html { -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            touch-action: manipulation;
        }
        .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); position: relative; padding-bottom: calc(70px + env(safe-area-inset-bottom)); }
        .hidden { display: none !important; }

        /* header */
        header {
            position: sticky; top: 0; z-index: 20;
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px;
            background: rgba(255,255,255,.94); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
        }
        header img.logo { width: 34px; height: 34px; border-radius: 10px; }
        header .name { font-size: 21px; font-weight: 800; letter-spacing: -.5px; flex: 1; }
        header .name span { color: var(--saffron-d); }
        header .hicon { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer; position: relative; }
        header .hicon:active { background: #f0f0f0; }
        header .hicon .dot { position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); border: 2px solid #fff; }

        /* auth */
        .authwrap {
            position: fixed; inset: 0; z-index: 80; background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; max-width: 480px; margin: 0 auto;
        }
        .authlogo { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 8px 24px rgba(245,158,11,.35); }
        .authtitle { font-size: 34px; font-weight: 800; letter-spacing: -.5px; margin: 14px 0 4px; }
        .authtitle span { color: var(--saffron-d); }
        .authsub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
        .authtabs { display: flex; background: #eee; border-radius: 12px; padding: 4px; margin-bottom: 18px; width: 100%; max-width: 340px; }
        .authtabs button { flex: 1; border: none; background: none; padding: 10px; border-radius: 9px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; color: var(--muted); }
        .authtabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
        .authform { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; }
        .authform input {
            border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px;
            font-size: 16px; font-family: inherit; background: #fff; color: var(--ink); outline: none; width: 100%;
        }
        .authform input:focus { border-color: var(--saffron); }
        .autherr { color: var(--red); font-size: 13px; min-height: 20px; margin-top: 10px; text-align: center; max-width: 340px; }
        .authnote { margin-top: 18px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }

        /* stories */
        .stories { display: flex; gap: 14px; overflow-x: auto; padding: 14px; background: var(--card); border-bottom: 1px solid var(--line); scrollbar-width: none; }
        .stories::-webkit-scrollbar { display: none; }
        .story { flex: none; width: 66px; text-align: center; cursor: pointer; }
        .story .ring {
            width: 62px; height: 62px; border-radius: 50%; padding: 3px;
            background: linear-gradient(45deg, var(--saffron), #ec4899, var(--green));
            margin: 0 auto 5px;
        }
        .story.seen .ring { background: #e5e5e5; }
        .story img { width: 100%; height: 100%; border-radius: 50%; border: 2.5px solid #fff; object-fit: cover; display: block; background: #eee; }
        .story .sname { font-size: 11px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* post card */
        .post { background: var(--card); border-bottom: 1px solid var(--line); margin-bottom: 8px; }
        .phead { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
        .phead img.av { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: #eee; }
        .phead .who { flex: 1; min-width: 0; }
        .phead .who .n { font-size: 14px; font-weight: 700; }
        .phead .who .t { font-size: 12px; color: var(--muted); }
        .followbtn {
            font-size: 13px; font-weight: 700; color: var(--saffron-d); background: none; border: none; cursor: pointer; font-family: inherit; padding: 6px 8px;
        }
        .followbtn.following { color: var(--muted); font-weight: 600; }
        .pimg { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #f0f0f0; display: block; cursor: pointer; position: relative; }
        .pimgwrap { position: relative; }
        .bigheart {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            pointer-events: none; opacity: 0;
        }
        .bigheart svg { width: 90px; height: 90px; filter: drop-shadow(0 4px 12px rgba(0,0,0,.3)); }
        .bigheart.pop { animation: pop .7s ease forwards; }
        @keyframes pop { 0% { opacity: 0; transform: scale(.3); } 25% { opacity: 1; transform: scale(1.15); } 60% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
        .pactions { display: flex; gap: 4px; padding: 8px 10px 2px; }
        .pactions button { background: none; border: none; cursor: pointer; padding: 6px; font-family: inherit; }
        .pactions button:active { transform: scale(.88); }
        .pactions .spacer { flex: 1; }
        .plikes { font-size: 14px; font-weight: 700; padding: 2px 14px; }
        .pcap { font-size: 14px; padding: 2px 14px 4px; line-height: 1.45; }
        .pcap b { font-weight: 700; }
        .pcomments { padding: 0 14px 10px; font-size: 13px; color: var(--muted); }
        .pcomments .c { margin: 3px 0; line-height: 1.4; }
        .pcomments .c b { color: var(--ink); font-weight: 700; }
        .viewall { cursor: pointer; font-weight: 600; }
        .cinput { display: flex; gap: 8px; padding: 8px 14px 12px; }
        .cinput input {
            flex: 1; border: 1px solid var(--line); border-radius: 20px; padding: 9px 14px;
            font-size: 14px; font-family: inherit; outline: none; background: var(--bg);
        }
        .cinput input:focus { border-color: var(--saffron); background: #fff; }
        .cinput button { border: none; background: none; color: var(--saffron-d); font-weight: 800; font-size: 14px; cursor: pointer; font-family: inherit; padding: 0 6px; }
        .delbtn { font-size: 12px; color: var(--muted); background: none; border: none; cursor: pointer; font-family: inherit; padding: 6px 8px; }

        /* explore */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; }
        .grid img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; background: #f0f0f0; cursor: pointer; }

        /* create */
        .composer { background: var(--card); border-radius: var(--radius); margin: 14px; padding: 14px; border: 1px solid var(--line); }
        .composer .crow { display: flex; gap: 10px; align-items: flex-start; }
        .composer img.av { width: 42px; height: 42px; border-radius: 50%; background: #eee; object-fit: cover; }
        .composer textarea {
            flex: 1; border: none; outline: none; resize: none; font-family: inherit; font-size: 16px;
            min-height: 90px; background: transparent; color: var(--ink);
        }
        .imgpick { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; }
        .imgpick::-webkit-scrollbar { display: none; }
        .imgpick img { width: 84px; height: 84px; border-radius: 10px; object-fit: cover; cursor: pointer; border: 3px solid transparent; flex: none; background: #f0f0f0; }
        .imgpick img.sel { border-color: var(--saffron); }
        .uploadtile {
            width: 84px; height: 84px; border-radius: 10px; flex: none; cursor: pointer;
            border: 2px dashed #d4d4d8; background: var(--bg); color: var(--muted);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
            font-size: 22px; font-family: inherit; overflow: hidden; position: relative;
        }
        .uploadtile span { font-size: 10px; font-weight: 700; }
        .uploadtile.sel { border-color: var(--saffron); border-style: solid; }
        .uploadtile img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; border: none; border-radius: 0; }
        .postbtn {
            width: 100%; margin-top: 10px; border: none; border-radius: 12px; cursor: pointer;
            background: linear-gradient(135deg, var(--saffron), var(--saffron-d)); color: #fff;
            font-size: 16px; font-weight: 800; padding: 13px; font-family: inherit;
        }
        .postbtn:active { transform: scale(.98); }
        .postbtn:disabled { opacity: .45; }

        /* activity */
        .notif { display: flex; gap: 12px; align-items: center; background: var(--card); padding: 12px 14px; border-bottom: 1px solid var(--line); }
        .notif img.av { width: 44px; height: 44px; border-radius: 50%; background: #eee; object-fit: cover; }
        .notif .txt { flex: 1; font-size: 14px; line-height: 1.4; }
        .notif .txt .tm { color: var(--muted); font-size: 12px; }
        .notif .nic { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #fef3e2; flex: none; font-size: 18px; }

        /* profile */
        .pcover { height: 110px; background: linear-gradient(120deg, #f59e0b, #ec4899 55%, #7c3aed); }
        .pbody { background: var(--card); padding: 0 16px 14px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
        .pbody img.pav { width: 84px; height: 84px; border-radius: 50%; border: 4px solid #fff; margin-top: -42px; background: #eee; object-fit: cover; }
        .pbody .pn { font-size: 20px; font-weight: 800; margin-top: 6px; }
        .pbody .ph { font-size: 14px; color: var(--muted); }
        .pbody .pbio { font-size: 14px; margin-top: 8px; line-height: 1.5; }
        .stats { display: flex; gap: 22px; margin: 12px 0; }
        .stats .s { text-align: left; }
        .stats .s .n { font-size: 17px; font-weight: 800; }
        .stats .s .l { font-size: 12px; color: var(--muted); }
        .editbtn {
            width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px;
            padding: 10px; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; color: var(--ink);
        }
        .logoutbtn {
            width: 100%; border: none; background: none; border-radius: 10px; margin-top: 8px;
            padding: 10px; font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit; color: var(--red);
        }
        .mocknote { text-align: center; font-size: 11px; color: var(--muted); padding: 14px; line-height: 1.6; }

        /* bottom nav */
        nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
            background: rgba(255,255,255,.96); backdrop-filter: blur(10px);
            border-top: 1px solid var(--line);
            padding-bottom: env(safe-area-inset-bottom);
        }
        nav .row { max-width: 480px; margin: 0 auto; display: flex; }
        nav button {
            flex: 1; background: none; border: none; cursor: pointer; padding: 10px 0 8px;
            color: var(--muted); font-family: inherit;
        }
        nav button.on { color: var(--ink); }
        nav button svg { width: 25px; height: 25px; display: block; margin: 0 auto; }

        /* story viewer */
        #storyViewer {
            position: fixed; inset: 0; z-index: 60; background: #000;
            display: flex; flex-direction: column;
        }
        #storyViewer .sbar { display: flex; gap: 6px; padding: 12px 12px 0; }
        #storyViewer .sbar .seg { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.3); overflow: hidden; }
        #storyViewer .sbar .seg i { display: block; height: 100%; width: 0; background: #fff; }
        #storyViewer .shead { display: flex; align-items: center; gap: 10px; padding: 10px 12px; color: #fff; }
        #storyViewer .shead img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        #storyViewer .shead .sn { font-weight: 700; font-size: 14px; flex: 1; }
        #storyViewer .shead .sx { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 6px; }
        #storyViewer .simg { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        #storyViewer .simg img { width: 100%; height: 100%; object-fit: cover; }
        #storyViewer .tapL, #storyViewer .tapR { position: absolute; top: 0; bottom: 0; width: 35%; }
        #storyViewer .tapL { left: 0; } #storyViewer .tapR { right: 0; }

        /* DMs */
        .overlay { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; }
        .dhead { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #fff; border-bottom: 1px solid var(--line); }
        .dhead .back { background: none; border: none; font-size: 26px; cursor: pointer; padding: 2px 10px 2px 2px; font-family: inherit; color: var(--ink); line-height: 1; }
        .dhead .dt { font-size: 17px; font-weight: 800; flex: 1; }
        .dhead img.av { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: #eee; }
        .dhead .on { font-size: 12px; color: var(--green); font-weight: 600; }
        .dhead .newchat { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--saffron-d); padding: 4px 6px; font-family: inherit; }
        .convo { display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: #fff; border-bottom: 1px solid var(--line); cursor: pointer; }
        .convo:active { background: #f7f7f7; }
        .convo img.av { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: #eee; }
        .convo .cmid { flex: 1; min-width: 0; }
        .convo .cn { font-size: 15px; font-weight: 700; }
        .convo .cl { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        .convo .cl.unread { color: var(--ink); font-weight: 700; }
        .convo .cright { text-align: right; flex: none; }
        .convo .ct { font-size: 11px; color: var(--muted); }
        .convo .ubadge { display: inline-block; min-width: 20px; height: 20px; border-radius: 10px; background: var(--saffron-d); color: #fff; font-size: 12px; font-weight: 800; line-height: 20px; text-align: center; padding: 0 6px; margin-top: 4px; }
        #chatBody { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 75%; padding: 10px 13px; border-radius: 18px; font-size: 14px; line-height: 1.45; word-wrap: break-word; }
        .msg.me { align-self: flex-end; background: linear-gradient(135deg, var(--saffron), var(--saffron-d)); color: #fff; border-bottom-right-radius: 6px; }
        .msg.them { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 6px; }
        .msg .mn { display: block; font-size: 11px; font-weight: 700; color: var(--saffron-d); margin-bottom: 2px; }
        .msg .mt { display: block; font-size: 10px; opacity: .7; margin-top: 3px; text-align: right; }
        .chatinput { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid var(--line); }
        .chatinput input { flex: 1; border: 1px solid var(--line); border-radius: 22px; padding: 11px 16px; font-size: 15px; font-family: inherit; outline: none; background: var(--bg); color: var(--ink); }
        .chatinput input:focus { border-color: var(--saffron); background: #fff; }
        .chatinput button { border: none; background: linear-gradient(135deg, var(--saffron), var(--saffron-d)); color: #fff; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 16px; flex: none; display: flex; align-items: center; justify-content: center; }
        .chatinput button:active { transform: scale(.92); }

        /* Edit profile */
        .fld { margin: 0 14px 14px; }
        .fld label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
        .fld input, .fld textarea { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 15px; font-family: inherit; background: #fff; color: var(--ink); outline: none; box-sizing: border-box; }
        .fld input:focus, .fld textarea:focus { border-color: var(--saffron); }
        .fld textarea { resize: vertical; min-height: 76px; }
        .savebtn { background: linear-gradient(135deg, var(--saffron), var(--saffron-d)); color: #fff; border: none; border-radius: 12px; padding: 13px; font-size: 16px; font-weight: 800; width: calc(100% - 28px); margin: 6px 14px 20px; cursor: pointer; font-family: inherit; }
        .savebtn:active { transform: scale(.98); }
        .savebtn:disabled { opacity: .5; }
        .avgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 4px 14px 16px; }
        .avgrid img { width: 100%; aspect-ratio: 1; border-radius: 50%; object-fit: cover; cursor: pointer; border: 3px solid transparent; background: #eee; }
        .avgrid img.sel { border-color: var(--saffron); }
        .epavwrap { text-align: center; padding: 18px 0 8px; position: relative; }
        .epav { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; background: #eee; }
        .epavcam { position: absolute; bottom: 6px; left: calc(50% + 22px); width: 32px; height: 32px; border-radius: 50%; background: var(--saffron); color: #fff; border: 3px solid #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .toast {
            position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%) translateY(16px);
            background: #1c1c1e; color: #fff; font-size: 14px; font-weight: 600;
            padding: 11px 20px; border-radius: 24px; opacity: 0; pointer-events: none;
            transition: opacity .25s, transform .25s; z-index: 90; white-space: nowrap; max-width: 92vw;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .loader { text-align: center; padding: 30px; color: var(--muted); font-size: 14px; }
        .spin { width: 26px; height: 26px; border: 3px solid #f3d9a8; border-top-color: var(--saffron-d); border-radius: 50%; margin: 0 auto 10px; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- AUTH GATE -->
    <div id="authScreen" class="authwrap hidden">
        <img class="authlogo" src="icon-192.png" alt="Adda">
        <div class="authtitle">Adda<span>.</span></div>
        <div class="authsub">Apna social media · made in India 🇮🇳</div>
        <div class="authtabs">
            <button id="tabLogin" class="on">Log in</button>
            <button id="tabSignup">Sign up</button>
        </div>
        <div class="authform" id="loginForm">
            <input id="liEmail" type="email" placeholder="Email" autocomplete="email">
            <input id="liPass" type="password" placeholder="Password" autocomplete="current-password">
            <button class="savebtn" id="liBtn" style="width:100%;margin:6px 0 0;">Log in</button>
        </div>
        <div class="authform hidden" id="signupForm">
            <input id="suName" placeholder="Full name" maxlength="40" autocomplete="name">
            <input id="suUser" placeholder="Username (e.g. priya.sharma)" maxlength="24" autocomplete="username">
            <input id="suEmail" type="email" placeholder="Email" autocomplete="email">
            <input id="suPass" type="password" placeholder="Password (6+ characters)" autocomplete="new-password">
            <button class="savebtn" id="suBtn" style="width:100%;margin:6px 0 0;">Create account</button>
        </div>
        <div class="autherr" id="authErr"></div>
        <div class="authnote">Free forever · your data stays yours.<br>Made with ❤️ by sauravhhh</div>
    </div>

    <div class="app" id="appShell">
        <header>
            <img class="logo" src="icon-192.png" alt="Adda">
            <div class="name">Adda<span>.</span></div>
            <div class="hicon" id="searchBtn" aria-label="Search">
                <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            </div>
            <div class="hicon" id="msgBtn" aria-label="Messages">
                <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                <span class="dot" style="display:none;"></span>
            </div>
        </header>

        <!-- HOME -->
        <section id="tab-home">
            <div class="stories" id="stories"></div>
            <div id="feed"></div>
        </section>

        <!-- EXPLORE -->
        <section id="tab-explore" class="hidden">
            <div class="grid" id="exploreGrid"></div>
        </section>

        <!-- CREATE -->
        <section id="tab-create" class="hidden">
            <div class="composer">
                <div class="crow">
                    <img class="av" id="composerAv" src="" alt="">
                    <textarea id="composerText" placeholder="Kya chal raha hai? Share an update…" maxlength="280"></textarea>
                </div>
                <div class="imgpick" id="imgPick"></div>
                <button class="postbtn" id="publishBtn" disabled>Post to Adda</button>
            </div>
            <div class="mocknote">Posts go live instantly for everyone on Adda.</div>
        </section>

        <!-- ACTIVITY -->
        <section id="tab-activity" class="hidden">
            <div id="notifList"></div>

    <script>
        (function () {
            'use strict';

            // ---------- Supabase ----------
            var SUPABASE_URL = 'https://mosycrhrpdaqcbfqolhq.supabase.co';
            var SUPABASE_KEY = 'sb_publishable_Z-dY6KLzNbsMb_ahgGVjJg_K5z6iyhc';
            var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            var PIC = function (seed, w, h) { return 'https://picsum.photos/seed/' + seed + '/' + (w || 600) + '/' + (h || 600); };
            var AV = function (n) { return 'https://i.pravatar.cc/100?img=' + n; };

            var myId = null;
            var myProfile = null;
            var feedPosts = [];
            var seenStories = [];
            try { seenStories = JSON.parse(localStorage.getItem('adda-seen') || '[]'); } catch (e) {}
            function saveSeen() { try { localStorage.setItem('adda-seen', JSON.stringify(seenStories)); } catch (e) {} }
            function readTimes() { try { return JSON.parse(localStorage.getItem('adda-read') || '{}'); } catch (e) { return {}; } }
            function saveReadTimes(m) { try { localStorage.setItem('adda-read', JSON.stringify(m)); } catch (e) {} }

            var SEED_STORIES = [
                { name: 'Priya', av: 47, img: 'adda-monsoon' },
                { name: 'Arjun', av: 53, img: 'adda-marine' },
                { name: 'Rohan', av: 59, img: 'adda-cricket' },
                { name: 'Sneha', av: 44, img: 'adda-panipuri' },
                { name: 'Kavya', av: 45, img: 'adda-filter' },
                { name: 'Vikram', av: 60, img: 'adda-ladakh' },
                { name: 'Ananya', av: 32, img: 'adda-pujo' }
            ];

            // ---------- helpers ----------
            function fmt(n) {
                n = n || 0;
                if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'k';
                return '' + n;
            }
            function esc(s) {
                return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }
            function timeAgo(iso) {
                var s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
                if (s < 60) return 'now';
                if (s < 3600) return Math.floor(s / 60) + 'm';
                if (s < 86400) return Math.floor(s / 3600) + 'h';
                if (s < 604800) return Math.floor(s / 86400) + 'd';
                return new Date(iso).toLocaleDateString();
            }
            function clockTime(iso) {
                var d = new Date(iso), h = d.getHours(), m = d.getMinutes();
                return (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m);
            }
            var toastEl = document.getElementById('toast');
            function toast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(toast.t);
                toast.t = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
            }
            function authError(msg) {
                var el = document.getElementById('authErr');
                el.textContent = msg;
                setTimeout(function () { el.textContent = ''; }, 4000);
            }

            // ---------- auth ----------
            var authScreen = document.getElementById('authScreen');
            var appShell = document.getElementById('appShell');
            document.getElementById('tabLogin').addEventListener('click', function () {
                this.classList.add('on'); document.getElementById('tabSignup').classList.remove('on');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('signupForm').classList.add('hidden');
            });
            document.getElementById('tabSignup').addEventListener('click', function () {
                this.classList.add('on'); document.getElementById('tabLogin').classList.remove('on');
                document.getElementById('signupForm').classList.remove('hidden');
                document.getElementById('loginForm').classList.add('hidden');
            });

            async function ensureProfile(user) {
                var res = await sb.from('profiles').select('*').eq('id', user.id).single();
                if (res.data) return res.data;
                var fallback = (user.email || 'user').split('@')[0].replace(/[^a-z0-9._]/gi, '').toLowerCase() || 'user';
                var ins = await sb.from('profiles').insert({
                    id: user.id,
                    username: fallback + Math.floor(Math.random() * 900 + 100),
                    name: fallback,
                    bio: '',
                    avatar_url: AV(12)
                }).select().single();
                if (ins.error) { authError(ins.error.message); return null; }
                return ins.data;
            }

            document.getElementById('liBtn').addEventListener('click', async function () {
                var email = document.getElementById('liEmail').value.trim();
                var pass = document.getElementById('liPass').value;
                if (!email || !pass) { authError('Enter your email and password.'); return; }
                this.disabled = true;
                var res = await sb.auth.signInWithPassword({ email: email, password: pass });
                this.disabled = false;
                if (res.error) { authError(res.error.message); return; }
                await startApp(res.data.session);
            });
            document.getElementById('suBtn').addEventListener('click', async function () {
                var name = document.getElementById('suName').value.trim();
                var username = document.getElementById('suUser').value.trim().replace(/^@+/, '').replace(/\s+/g, '').toLowerCase();
                var email = document.getElementById('suEmail').value.trim();
                var pass = document.getElementById('suPass').value;
                if (!name || !username || !email || !pass) { authError('Fill all fields to create your account.'); return; }
                if (pass.length < 6) { authError('Password needs at least 6 characters.'); return; }
                this.disabled = true;
                var res = await sb.auth.signUp({ email: email, password: pass });
                if (res.error) { this.disabled = false; authError(res.error.message); return; }
                var user = res.data.user;
                // claim username first so it is unique
                if (res.data.session) {
                    var chk = await sb.from('profiles').select('id').eq('username', username).limit(1);
                    if (chk.data && chk.data.length) {
                        await sb.auth.signOut();
                        this.disabled = false;
                        authError('That username is taken — try another.');
                        return;
                    }
                    var ins = await sb.from('profiles').insert({
                        id: user.id, username: username, name: name, bio: '', avatar_url: AV(12)
                    });
                    this.disabled = false;
                    if (ins.error) {
                        await sb.auth.signOut();
                        authError(ins.error.message.includes('duplicate') ? 'That username is taken — try another.' : ins.error.message);
                        return;
                    }
                    await startApp(res.data.session);
                } else {
                    this.disabled = false;
                    authError('Account created! Check your email to confirm, then log in.');
                }
            });
            document.getElementById('logoutBtn').addEventListener('click', async function () {
                await sb.auth.signOut();
                location.reload();
            });

            async function startApp(session) {
                myId = session.user.id;
                myProfile = await ensureProfile(session.user);
                if (!myProfile) { authScreen.classList.remove('hidden'); return; }
                authScreen.classList.add('hidden');
                document.getElementById('composerAv').src = myProfile.avatar_url || AV(12);
                applyProfile();
                renderStories();
                await reloadFeed();
                renderExplore();
                renderImgPick();
                await renderActivity();
                await renderProfileGrid();
                updateMsgDot();
                subscribeRealtime();
            }

            // ---------- tabs ----------
            var TABS = [
                { id: 'home', svg: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/>' },
                { id: 'explore', svg: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13 13l-4.5 2.5L11 11z"/>' },
                { id: 'create', svg: '<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>' },
                { id: 'activity', svg: '<path d="M12 20.5C7 16.5 3 13.2 3 9.3 3 6.4 5.2 4.5 7.7 4.5c1.7 0 3.3.9 4.3 2.4 1-1.5 2.6-2.4 4.3-2.4 2.5 0 4.7 1.9 4.7 4.8 0 3.9-4 7.2-9 11.2z"/>' },
                { id: 'profile', svg: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>' }
            ];
            var tabbar = document.getElementById('tabbar');
            TABS.forEach(function (t) {
                var b = document.createElement('button');
                b.setAttribute('data-tab', t.id);
                b.setAttribute('aria-label', t.id);
                b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + t.svg + '</svg>';
                if (t.id === 'home') b.classList.add('on');
                b.addEventListener('click', function () { switchTab(t.id); });
                tabbar.appendChild(b);
            });
            function switchTab(id) {
                Array.prototype.forEach.call(tabbar.children, function (b) {
                    b.classList.toggle('on', b.getAttribute('data-tab') === id);
                });
                TABS.forEach(function (t) {
                    document.getElementById('tab-' + t.id).classList.toggle('hidden', t.id !== id);
                });
                window.scrollTo(0, 0);
                if (id === 'activity') renderActivity();
                if (id === 'profile') renderProfileGrid();
            }

            // ---------- stories (demo) ----------
            function renderStories() {
                var el = document.getElementById('stories');
                var html = '<div class="story" data-story="me"><div class="ring" style="background:#e5e5e5;"><img src="' + esc(myProfile.avatar_url || AV(12)) + '" alt=""></div><div class="sname">Your story</div></div>';
                SEED_STORIES.forEach(function (s, i) {
                    var seen = seenStories.indexOf(i) >= 0 ? ' seen' : '';
                    html += '<div class="story' + seen + '" data-story="' + i + '"><div class="ring"><img src="' + AV(s.av) + '" alt="" loading="lazy"></div><div class="sname">' + esc(s.name) + '</div></div>';
                });
                el.innerHTML = html;
                Array.prototype.forEach.call(el.children, function (c) {
                    c.addEventListener('click', function () { openStory(c.getAttribute('data-story')); });
                });
            }

            // ---------- feed ----------
            async function reloadFeed() {
                var feed = document.getElementById('feed');
                feed.innerHTML = '<div class="loader"><div class="spin"></div>Loading feed…</div>';
                var res = await sb.from('posts')
                    .select('id,caption,image_url,created_at,user_id,profiles(id,username,name,avatar_url),likes(user_id),comments(id,body,created_at,user_id,profiles(username))')
                    .order('created_at', { ascending: false }).limit(40);
                if (res.error) { feed.innerHTML = '<div class="loader">Could not load feed. Pull to retry.</div>'; return; }
                feedPosts = res.data || [];
                renderFeed();
            }
            function isLiked(p) { return (p.likes || []).some(function (l) { return l.user_id === myId; }); }
            function postHTML(p) {
                var prof = p.profiles || {};
                var liked = isLiked(p);
                var mine = p.user_id === myId;
                var comments = p.comments || [];
                var shown = comments.slice(-2);
                var html = '<article class="post" data-id="' + p.id + '">';
                html += '<div class="phead"><img class="av" src="' + esc(prof.avatar_url || AV(12)) + '" alt="" loading="lazy">' +
                    '<div class="who"><div class="n">' + esc(prof.name || 'User') + '</div><div class="t">@' + esc(prof.username || 'user') + ' · ' + timeAgo(p.created_at) + '</div></div>' +
                    (mine
                        ? '<button class="delbtn">Delete</button>'
                        : '<button class="followbtn" data-follow="' + esc(prof.username || '') + '">Follow</button>') + '</div>';
                if (p.image_url) {
                    html += '<div class="pimgwrap"><img class="pimg" src="' + esc(p.image_url) + '" alt="" loading="lazy">' +
                        '<div class="bigheart"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 21C7 16.5 3 13.2 3 9.3 3 6.4 5.2 4.5 7.7 4.5c1.7 0 3.3.9 4.3 2.4 1-1.5 2.6-2.4 4.3-2.4 2.5 0 4.7 1.9 4.7 4.8 0 3.9-4 7.2-9 11.2z"/></svg></div></div>';
                }
                html += '<div class="pactions">' +
                    '<button class="likebtn" aria-label="Like"><svg width="26" height="26" viewBox="0 0 24 24" fill="' + (liked ? '#ef4444' : 'none') + '" stroke="' + (liked ? '#ef4444' : 'currentColor') + '" stroke-width="1.8"><path d="M12 20.5C7 16.5 3 13.2 3 9.3 3 6.4 5.2 4.5 7.7 4.5c1.7 0 3.3.9 4.3 2.4 1-1.5 2.6-2.4 4.3-2.4 2.5 0 4.7 1.9 4.7 4.8 0 3.9-4 7.2-9 11.2z"/></svg></button>' +
                    '<button class="commentbtn" aria-label="Comment"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button>' +
                    '<button class="sharebtn" aria-label="Share"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg></button>' +
                    '<span class="spacer"></span></div>';
                html += '<div class="plikes">' + fmt((p.likes || []).length) + ' likes</div>';
                html += '<div class="pcap"><b>' + esc(prof.username || 'user') + '</b> ' + esc(p.caption) + '</div>';
                html += '<div class="pcomments" data-comments>';
                if (comments.length > 2) html += '<div class="viewall">View all ' + comments.length + ' comments</div>';
                html += commentsHTML(shown) + '</div>';
                html += '<div class="cinput hidden"><input placeholder="Add a comment…" maxlength="140"><button>Post</button></div>';
                html += '</article>';
                return html;
            }
            function commentsHTML(list) {
                return list.map(function (c) {
                    var un = (c.profiles && c.profiles.username) || 'user';
                    return '<div class="c"><b>' + esc(un) + '</b> ' + esc(c.body) + '</div>';
                }).join('');
            }
            function renderFeed() {
                var feed = document.getElementById('feed');
                if (!feedPosts.length) {
                    feed.innerHTML = '<div class="mocknote" style="padding:40px 14px;">No posts yet.<br>Be the first — tap ＋ below to share.</div>';
                    return;
                }
                feed.innerHTML = feedPosts.map(postHTML).join('');
                Array.prototype.forEach.call(feed.children, function (card) {
                    var id = card.getAttribute('data-id');
                    var p = feedPosts.filter(function (x) { return x.id === id; })[0];
                    if (!p) return;
                    var likeBtn = card.querySelector('.likebtn');
                    var pimg = card.querySelector('.pimg');
                    var heart = card.querySelector('.bigheart');

                    async function toggleLike(animate) {
                        var svg = likeBtn.querySelector('svg');
                        var liked = isLiked(p);
                        if (liked) {
                            svg.setAttribute('fill', 'none'); svg.setAttribute('stroke', 'currentColor');
                            p.likes = (p.likes || []).filter(function (l) { return l.user_id !== myId; });
                            await sb.from('likes').delete().eq('post_id', id).eq('user_id', myId);
                        } else {
                            svg.setAttribute('fill', '#ef4444'); svg.setAttribute('stroke', '#ef4444');
                            (p.likes = p.likes || []).push({ user_id: myId });
                            if (animate && heart) { heart.classList.remove('pop'); void heart.offsetWidth; heart.classList.add('pop'); }
                            await sb.from('likes').insert({ post_id: id, user_id: myId });
                        }
                        card.querySelector('.plikes').textContent = fmt((p.likes || []).length) + ' likes';
                    }
                    likeBtn.addEventListener('click', function () { toggleLike(false); });
                    if (pimg) {
                        var lastTap = 0;
                        pimg.addEventListener('click', function () {
                            var now = Date.now();
                            if (now - lastTap < 350 && !isLiked(p)) toggleLike(true);
                            lastTap = now;
                        });
                    }
                    var cbtn = card.querySelector('.commentbtn');
                    var cinput = card.querySelector('.cinput');
                    var cfield = cinput.querySelector('input');
                    cbtn.addEventListener('click', function () {
                        cinput.classList.toggle('hidden');
                        if (!cinput.classList.contains('hidden')) cfield.focus();
                    });
                    var viewAll = card.querySelector('.viewall');
                    if (viewAll) viewAll.addEventListener('click', function () {
                        card.querySelector('[data-comments]').innerHTML = commentsHTML(p.comments || []);
                        cinput.classList.remove('hidden');
                        cfield.focus();
                    });
                    async function addComment() {
                        var t = cfield.value.trim();
                        if (!t) return;
                        cfield.value = '';
                        var res = await sb.from('comments').insert({ post_id: id, user_id: myId, body: t })
                            .select('id,body,created_at,user_id,profiles(username)').single();
                        if (res.error) { toast('Could not post comment'); return; }
                        (p.comments = p.comments || []).push(res.data);
                        card.querySelector('[data-comments]').innerHTML = commentsHTML((p.comments || []).slice(-2));
                        toast('Comment posted');
                    }
                    cinput.querySelector('button').addEventListener('click', addComment);
                    cfield.addEventListener('keydown', function (e) { if (e.key === 'Enter') addComment(); });
                    card.querySelector('.sharebtn').addEventListener('click', function () {
                        var link = location.origin + location.pathname + '#post-' + id;
                        if (navigator.clipboard) navigator.clipboard.writeText(link).catch(function () {});
                        toast('Link copied to clipboard');
                    });
                    var fbtn = card.querySelector('.followbtn');
                    if (fbtn) {
                        (async function () {
                            var r = await sb.from('follows').select('follower_id').eq('follower_id', myId).eq('following_id', p.user_id).limit(1);
                            if (r.data && r.data.length) { fbtn.textContent = 'Following'; fbtn.classList.add('following'); }
                        })();
                        fbtn.addEventListener('click', async function () {
                            var following = fbtn.classList.contains('following');
                            if (following) {
                                await sb.from('follows').delete().eq('follower_id', myId).eq('following_id', p.user_id);
                                fbtn.textContent = 'Follow'; fbtn.classList.remove('following');
                            } else {
                                var r = await sb.from('follows').insert({ follower_id: myId, following_id: p.user_id });
                                if (r.error) { toast('Could not follow'); return; }
                                fbtn.textContent = 'Following'; fbtn.classList.add('following');
                                toast('Following @' + ((p.profiles || {}).username || 'user'));
                            }
                        });
                    }
                    var del = card.querySelector('.delbtn');
                    if (del) del.addEventListener('click', async function () {
                        if (!confirm('Delete this post?')) return;
                        var r = await sb.from('posts').delete().eq('id', id);
                        if (r.error) { toast('Could not delete'); return; }
                        feedPosts = feedPosts.filter(function (x) { return x.id !== id; });
                        renderFeed(); renderExplore();
                        toast('Post deleted');
                    });
                });
            }

            // ---------- explore ----------
            function renderExplore() {
                var imgs = feedPosts.filter(function (p) { return p.image_url; });
                document.getElementById('exploreGrid').innerHTML = imgs.length
                    ? imgs.map(function (p) { return '<img src="' + esc(p.image_url) + '" alt="" loading="lazy">'; }).join('')
                    : '<div class="mocknote" style="grid-column:1/-1;padding:40px 14px;">Photos from the community will appear here.</div>';
            }

            // ---------- create ----------
            var pickedImg = null;   // picsum seed string
            var pickedFile = null;  // File object
            var pickedPreview = null;
            function renderImgPick() {
                var seeds = ['adda-chai', 'adda-holi', 'adda-taj', 'adda-thali', 'adda-ghat', 'adda-mela'];
                var el = document.getElementById('imgPick');
                el.innerHTML = '<label class="uploadtile" id="uploadTile">📷<span>Upload</span><input type="file" id="photoInput" accept="image/*" class="hidden"></label>' +
                    seeds.map(function (s) {
                        return '<img src="' + PIC(s, 200, 200) + '" data-seed="' + s + '" alt="" loading="lazy">';
                    }).join('');
                Array.prototype.forEach.call(el.querySelectorAll('img[data-seed]'), function (im) {
                    im.addEventListener('click', function () {
                        Array.prototype.forEach.call(el.querySelectorAll('img[data-seed]'), function (x) { x.classList.remove('sel'); });
                        var tile = document.getElementById('uploadTile');
                        tile.classList.remove('sel');
                        var pv = tile.querySelector('img');
                        if (pv) pv.remove();
                        tile.innerHTML = '📷<span>Upload</span>';
                        im.classList.add('sel');
                        pickedImg = im.getAttribute('data-seed');
                        pickedFile = null;
                        updatePublishBtn();
                    });
                });
                document.getElementById('photoInput').addEventListener('change', function (e) {
                    var f = e.target.files[0];
                    if (!f) return;
                    pickedFile = f;
                    pickedImg = null;
                    Array.prototype.forEach.call(el.querySelectorAll('img[data-seed]'), function (x) { x.classList.remove('sel'); });
                    var tile = document.getElementById('uploadTile');
                    tile.classList.add('sel');
                    var url = URL.createObjectURL(f);
                    tile.innerHTML = '<img src="' + url + '" alt="">';
                    var inp = document.createElement('input');
                    inp.type = 'file'; inp.accept = 'image/*'; inp.className = 'hidden'; inp.id = 'photoInput';
                    tile.appendChild(inp);
                    inp.addEventListener('change', arguments.callee);
                    updatePublishBtn();
                });
            }
            var composerText = document.getElementById('composerText');
            var publishBtn = document.getElementById('publishBtn');
            function updatePublishBtn() {
                publishBtn.disabled = composerText.value.trim().length === 0;
            }
            composerText.addEventListener('input', updatePublishBtn);
            publishBtn.addEventListener('click', async function () {
                var t = composerText.value.trim();
                if (!t) return;
                publishBtn.disabled = true;
                publishBtn.textContent = 'Posting…';
                var imageUrl = null;
                try {
                    if (pickedFile) {
                        var path = myId + '/' + Date.now() + '.jpg';
                        var up = await sb.storage.from('post-images').upload(path, pickedFile, { upsert: true });
                        if (up.error) throw up.error;
                        imageUrl = sb.storage.from('post-images').getPublicUrl(path).data.publicUrl;
                    } else if (pickedImg) {
                        imageUrl = PIC(pickedImg);
                    }
                    var ins = await sb.from('posts').insert({ user_id: myId, caption: t, image_url: imageUrl }).select().single();
                    if (ins.error) throw ins.error;
                    composerText.value = '';
                    pickedImg = null; pickedFile = null;
                    renderImgPick();
                    updatePublishBtn();
                    await reloadFeed();
                    renderExplore();
                    switchTab('home');
                    toast('Posted 🎉');
                } catch (err) {
                    toast('Could not post: ' + (err.message || 'error'));
                }
                publishBtn.disabled = false;
                publishBtn.textContent = 'Post to Adda';
            });

            // ---------- activity (real) ----------
            async function renderActivity() {
                var el = document.getElementById('notifList');
                el.innerHTML = '<div class="loader"><div class="spin"></div>Loading…</div>';
                var items = [];
                try {
                    var myPostIds = feedPosts.filter(function (p) { return p.user_id === myId; }).map(function (p) { return p.id; });
                    if (myPostIds.length) {
                        var lr = await sb.from('likes').select('created_at,user_id,profiles(name,avatar_url)').in('post_id', myPostIds).neq('user_id', myId).order('created_at', { ascending: false }).limit(10);
                        (lr.data || []).forEach(function (l) {
                            items.push({ t: l.created_at, icon: '❤️', av: (l.profiles || {}).avatar_url, text: '<b>' + esc((l.profiles || {}).name || 'Someone') + '</b> liked your post' });
                        });
                        var cr = await sb.from('comments').select('created_at,body,user_id,profiles(name,avatar_url)').in('post_id', myPostIds).neq('user_id', myId).order('created_at', { ascending: false }).limit(10);
                        (cr.data || []).forEach(function (c) {
                            items.push({ t: c.created_at, icon: '💬', av: (c.profiles || {}).avatar_url, text: '<b>' + esc((c.profiles || {}).name || 'Someone') + '</b> commented: “' + esc(c.body).slice(0, 60) + '”' });
                        });
                    }
                    var fr = await sb.from('follows').select('created_at,follower_id,profiles!follows_follower_id_fkey(name,avatar_url)').eq('following_id', myId).order('created_at', { ascending: false }).limit(10);
                    (fr.data || []).forEach(function (f) {
                        var pr = f.profiles || {};
                        items.push({ t: f.created_at, icon: '👥', av: pr.avatar_url, text: '<b>' + esc(pr.name || 'Someone') + '</b> started following you' });
                    });
                } catch (e) {}
                items.sort(function (a, b) { return new Date(b.t) - new Date(a.t); });
                el.innerHTML = items.length
                    ? items.slice(0, 30).map(function (n) {
                        return '<div class="notif"><img class="av" src="' + esc(n.av || AV(12)) + '" alt="" loading="lazy">' +
                            '<div class="txt">' + n.text + '<br><span class="tm">' + timeAgo(n.t) + ' ago</span></div>' +
                            '<div class="nic">' + n.icon + '</div></div>';
                    }).join('')
                    : '<div class="mocknote" style="padding:40px 14px;">Nothing yet.<br>Likes, comments and new followers will show up here.</div>';
            }

            // ---------- profile ----------
            function applyProfile() {
                var p = myProfile || {};
                document.getElementById('pfAv').src = p.avatar_url || AV(12);
                document.getElementById('pfName').textContent = p.name || 'User';
                document.getElementById('pfHandle').textContent = '@' + (p.username || 'user');
                document.getElementById('pfBio').innerHTML = esc(p.bio || '').replace(/\n/g, '<br>');
            }
            async function renderProfileGrid() {
                var grid = document.getElementById('profileGrid');
                var res = await sb.from('posts').select('id,image_url').eq('user_id', myId).order('created_at', { ascending: false });
                var mine = res.data || [];
                document.getElementById('statPosts').textContent = mine.length;
                var f1 = await sb.from('follows').select('follower_id', { count: 'exact', head: true }).eq('following_id', myId);
                var f2 = await sb.from('follows').select('follower_id', { count: 'exact', head: true }).eq('follower_id', myId);
                document.getElementById('statFollowers').textContent = fmt(f1.count || 0);
                document.getElementById('statFollowing').textContent = fmt(f2.count || 0);
                grid.innerHTML = mine.length
                    ? mine.map(function (p) { return p.image_url ? '<img src="' + esc(p.image_url) + '" alt="" loading="lazy">' : ''; }).join('')
                    : '<div class="mocknote" style="grid-column:1/-1;">No posts yet — tap ＋ to share your first update.</div>';
            }

            // ---------- edit profile ----------
            var AVPICK = [12, 32, 5, 68, 25, 52, 15, 44, 33, 59, 22, 47];
            var epAvatarUrl = null;
            var editProfileEl = document.getElementById('editProfile');
            function openEditProfile() {
                var p = myProfile || {};
                epAvatarUrl = p.avatar_url || AV(12);
                document.getElementById('epAv').src = epAvatarUrl;
                document.getElementById('epName').value = p.name || '';
                document.getElementById('epHandle').value = p.username || '';
                document.getElementById('epBio').value = p.bio || '';
                var grid = document.getElementById('avGrid');
                grid.innerHTML = '';
                AVPICK.forEach(function (n) {
                    var img = document.createElement('img');
                    img.src = AV(n);
                    img.alt = '';
                    img.loading = 'lazy';
                    if (AV(n) === epAvatarUrl) img.classList.add('sel');
                    img.addEventListener('click', function () {
                        epAvatarUrl = AV(n);
                        document.getElementById('epAv').src = epAvatarUrl;
                        Array.prototype.forEach.call(grid.children, function (c) { c.classList.remove('sel'); });
                        img.classList.add('sel');
                    });
                    grid.appendChild(img);
                });
                editProfileEl.classList.remove('hidden');
            }
            document.getElementById('editProfileBtn').addEventListener('click', openEditProfile);
            document.getElementById('avatarInput').addEventListener('change', async function (e) {
                var f = e.target.files[0];
                if (!f) return;
                toast('Uploading photo…');
                var path = myId + '/' + Date.now() + '.jpg';
                var up = await sb.storage.from('avatars').upload(path, f, { upsert: true });
                if (up.error) { toast('Upload failed'); return; }
                epAvatarUrl = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
                document.getElementById('epAv').src = epAvatarUrl;
                toast('Photo ready — tap Save');
            });
            document.getElementById('epSave').addEventListener('click', async function () {
                var name = document.getElementById('epName').value.trim() || myProfile.name;
                var handle = document.getElementById('epHandle').value.trim().replace(/^@+/, '').replace(/\s+/g, '').toLowerCase() || myProfile.username;
                var bio = document.getElementById('epBio').value.trim();
                this.disabled = true;
                var res = await sb.from('profiles').update({ name: name, username: handle, bio: bio, avatar_url: epAvatarUrl }).eq('id', myId).select().single();
                this.disabled = false;
                if (res.error) {
                    toast(res.error.message.includes('duplicate') ? 'Username taken — try another' : 'Could not save');
                    return;
                }
                myProfile = res.data;
                applyProfile();
                document.getElementById('composerAv').src = myProfile.avatar_url || AV(12);
                editProfileEl.classList.add('hidden');
                toast('Profile updated ✅');
            });

            // ---------- story viewer (demo) ----------
            var storyIdx = 0, storyProg = null;
            var viewer = document.getElementById('storyViewer');
            function openStory(which) {
                if (which === 'me') { toast('Stories are demo for now'); return; }
                storyIdx = parseInt(which, 10);
                viewer.classList.remove('hidden');
                showStory();
            }
            function showStory() {
                var s = SEED_STORIES[storyIdx];
                document.getElementById('storyAv').src = AV(s.av);
                document.getElementById('storyName').textContent = s.name;
                document.getElementById('storyImg').src = PIC(s.img, 700, 1100);
                var segs = document.getElementById('storySegs');
                segs.innerHTML = SEED_STORIES.map(function (_, i) {
                    return '<div class="seg"><i style="width:' + (i < storyIdx ? '100' : '0') + '%"></i></div>';
                }).join('');
                var bar = segs.children[storyIdx].firstChild;
                if (storyProg) cancelAnimationFrame(storyProg);
                var start = performance.now();
                (function tick(now) {
                    var p = Math.min(1, (now - start) / 3500);
                    bar.style.width = (p * 100) + '%';
                    if (p < 1) storyProg = requestAnimationFrame(tick);
                    else nextStory();
                })(start);
                if (seenStories.indexOf(storyIdx) < 0) { seenStories.push(storyIdx); saveSeen(); renderStories(); }
            }
            function nextStory() {
                if (storyIdx < SEED_STORIES.length - 1) { storyIdx++; showStory(); }
                else closeStory();
            }
            function prevStory() { if (storyIdx > 0) { storyIdx--; showStory(); } }
            function closeStory() {
                if (storyProg) cancelAnimationFrame(storyProg);
                viewer.classList.add('hidden');
            }
            document.getElementById('storyClose').addEventListener('click', closeStory);
            document.getElementById('tapNext').addEventListener('click', nextStory);
            document.getElementById('tapPrev').addEventListener('click', prevStory);

            document.getElementById('searchBtn').addEventListener('click', function () { switchTab('explore'); });
            document.getElementById('msgBtn').addEventListener('click', openDMList);

            // ---------- DMs (real) ----------
            var dmListEl = document.getElementById('dmList');
            var dmChatEl = document.getElementById('dmChat');
            var chatBody = document.getElementById('chatBody');
            var chatField = document.getElementById('chatField');
            var activeConvo = null;
            var activeConvoName = '';
            var msgChannel = null;
            var dmChannel = null;

            async function openDMList() {
                renderDMList();
                dmListEl.classList.remove('hidden');
            }
            async function myConversations() {
                var mem = await sb.from('conversation_members').select('conversation_id').eq('user_id', myId);
                var ids = (mem.data || []).map(function (m) { return m.conversation_id; });
                if (!ids.length) return [];
                var res = await sb.from('conversations')
                    .select('id,created_at,conversation_members(user_id,profiles(id,username,name,avatar_url)),messages(id,body,created_at,sender_id)')
                    .in('id', ids);
                var convos = res.data || [];
                convos.forEach(function (c) {
                    (c.messages || []).sort(function (a, b) { return new Date(a.created_at) - new Date(b.created_at); });
                });
                convos.sort(function (a, b) {
                    var la = (a.messages || []).slice(-1)[0], lb = (b.messages || []).slice(-1)[0];
                    return new Date((lb || {}).created_at || b.created_at) - new Date((la || {}).created_at || a.created_at);
                });
                return convos;
            }
            function convoPeer(c) {
                var others = (c.conversation_members || []).filter(function (m) { return m.user_id !== myId; });
                var p = (others[0] || {}).profiles || {};
                return { name: p.name || 'Chat', username: p.username || '', avatar: p.avatar_url || AV(12) };
            }
            async function renderDMList() {
                var el = document.getElementById('convoList');
                el.innerHTML = '<div class="loader"><div class="spin"></div>Loading chats…</div>';
                var convos = await myConversations();
                var reads = readTimes();
                if (!convos.length) {
                    el.innerHTML = '<div class="mocknote" style="padding:40px 14px;">No messages yet.<br>Tap ✎ above and enter someone\'s username to start chatting.</div>';
                    updateMsgDot();
                    return;
                }
                el.innerHTML = convos.map(function (c) {
                    var peer = convoPeer(c);
                    var msgs = c.messages || [];
                    var lm = msgs[msgs.length - 1];
                    var preview = lm ? (lm.sender_id === myId ? 'You: ' : '') + lm.body : 'Say hello 👋';
                    var unread = lm && lm.sender_id !== myId && new Date(lm.created_at) > new Date(reads[c.id] || 0);
                    return '<div class="convo" data-id="' + c.id + '">' +
                        '<img class="av" src="' + esc(peer.avatar) + '" alt="" loading="lazy">' +
                        '<div class="cmid"><div class="cn">' + esc(peer.name) + '</div>' +
                        '<div class="cl' + (unread ? ' unread' : '') + '">' + esc(preview) + '</div></div>' +
                        '<div class="cright"><div class="ct">' + (lm ? clockTime(lm.created_at) : '') + '</div>' +
                        (unread ? '<span class="ubadge">1</span>' : '') + '</div></div>';
                }).join('');
                Array.prototype.forEach.call(el.children, function (row) {
                    row.addEventListener('click', function () { openChat(row.getAttribute('data-id')); });
                });
                updateMsgDot();
            }
            async function updateMsgDot() {
                try {
                    var convos = await myConversations();
                    var reads = readTimes();
                    var any = convos.some(function (c) {
                        var lm = (c.messages || []).slice(-1)[0];
                        return lm && lm.sender_id !== myId && new Date(lm.created_at) > new Date(reads[c.id] || 0);
                    });
                    document.querySelector('#msgBtn .dot').style.display = any ? 'block' : 'none';
                } catch (e) {}
            }
            async function openChat(id) {
                var convos = await myConversations();
                activeConvo = convos.filter(function (c) { return c.id === id; })[0];
                if (!activeConvo) return;
                var peer = convoPeer(activeConvo);
                activeConvoName = peer.name;
                document.getElementById('chatAv').src = peer.avatar;
                document.getElementById('chatName').textContent = peer.name;
                document.getElementById('chatStatus').textContent = '@' + peer.username;
                var reads = readTimes();
                reads[id] = new Date().toISOString();
                saveReadTimes(reads);
                dmListEl.classList.add('hidden');
                dmChatEl.classList.remove('hidden');
                renderChat();
                updateMsgDot();
                if (msgChannel) sb.removeChannel(msgChannel);
                msgChannel = sb.channel('chat-' + id)
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'conversation_id=eq.' + id }, function (payload) {
                        if (activeConvo && payload.new.conversation_id === activeConvo.id) {
                            (activeConvo.messages = activeConvo.messages || []).push(payload.new);
                            appendMsg(payload.new);
                            var r = readTimes(); r[id] = new Date().toISOString(); saveReadTimes(r);
                        }
                    })
                    .subscribe();
            }
            function renderChat() {
                chatBody.innerHTML = '';
                (activeConvo.messages || []).forEach(appendMsg);
                chatBody.scrollTop = chatBody.scrollHeight;
            }
            function appendMsg(m) {
                var div = document.createElement('div');
                div.className = 'msg ' + (m.sender_id === myId ? 'me' : 'them');
                div.innerHTML = esc(m.body) + '<span class="mt">' + clockTime(m.created_at) + '</span>';
                chatBody.appendChild(div);
                chatBody.scrollTop = chatBody.scrollHeight;
            }
            async function sendChat() {
                var t = chatField.value.trim();
                if (!t || !activeConvo) return;
                chatField.value = '';
                var res = await sb.from('messages').insert({
                    conversation_id: activeConvo.id, sender_id: myId, body: t
                }).select().single();
                if (res.error) { toast('Could not send'); return; }
                (activeConvo.messages = activeConvo.messages || []).push(res.data);
                appendMsg(res.data);
            }
            document.getElementById('chatSend').addEventListener('click', sendChat);
            chatField.addEventListener('keydown', function (e) { if (e.key === 'Enter') sendChat(); });

            document.getElementById('newChatBtn').addEventListener('click', async function () {
                var u = prompt('Enter their username (without @):');
                if (!u) return;
                u = u.trim().replace(/^@+/, '').toLowerCase();
                if (!u) return;
                if (u === (myProfile.username || '').toLowerCase()) { toast('That\'s you 🙂'); return; }
                var res = await sb.from('profiles').select('id,username,name').eq('username', u).limit(1);
                if (res.error || !res.data.length) { toast('No user @' + u + ' found'); return; }
                var peer = res.data[0];
                // find existing 1:1 conversation
                var convos = await myConversations();
                var existing = convos.filter(function (c) {
                    var mems = (c.conversation_members || []).map(function (m) { return m.user_id; });
                    return mems.length === 2 && mems.indexOf(peer.id) >= 0;
                })[0];
                if (existing) { openChat(existing.id); return; }
                var newId = (crypto.randomUUID ? crypto.randomUUID() : 'c-' + Date.now() + '-' + Math.random().toString(16).slice(2));
                var cr = await sb.from('conversations').insert({ id: newId });
                if (cr.error) { toast('Could not start chat'); return; }
                // add self first (RLS: users can add themselves), then the peer (RLS: members can add others)
                var m1 = await sb.from('conversation_members').insert({ conversation_id: newId, user_id: myId });
                if (m1.error) { toast('Could not start chat'); return; }
                var m2 = await sb.from('conversation_members').insert({ conversation_id: newId, user_id: peer.id });
                if (m2.error) { toast('Could not start chat'); return; }
                toast('Chat started with @' + peer.username);
                openChat(newId);
            });

            // ---------- realtime: live feed ----------
            function subscribeRealtime() {
                try {
                    sb.channel('adda-feed')
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, function () {
                            reloadFeed().then(renderExplore);
                        })
                        .subscribe();
                    dmChannel = sb.channel('adda-dm')
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, function () {
                            if (!dmChatEl.classList.contains('hidden') || !dmListEl.classList.contains('hidden')) renderDMList();
                            updateMsgDot();
                        })
                        .subscribe();
                } catch (e) {}
            }

            Array.prototype.forEach.call(document.querySelectorAll('[data-back]'), function (b) {
                b.addEventListener('click', function () {
                    if (msgChannel) { sb.removeChannel(msgChannel); msgChannel = null; }
                    if (!dmChatEl.classList.contains('hidden')) {
                        dmChatEl.classList.add('hidden');
                        dmListEl.classList.remove('hidden');
                        activeConvo = null;
                        renderDMList();
                    } else {
                        dmListEl.classList.add('hidden');
                        editProfileEl.classList.add('hidden');
                    }
                });
            });

            // ---------- init ----------
            (async function init() {
                try {
                    var s = await sb.auth.getSession();
                    if (s.data.session) {
                        await startApp(s.data.session);
                    } else {
                        authScreen.classList.remove('hidden');
                    }
                } catch (e) {
                    authScreen.classList.remove('hidden');
                }
                if ('serviceWorker' in navigator) {
                    window.addEventListener('load', function () {
                        navigator.serviceWorker.register('sw.js').catch(function (err) {
                            console.warn('SW registration failed:', err);
                        });
                    });
                }
            })();
        })();
    </script>
</body>
</html>
